# PA-Converter / Expedition Apache site (native, no containers)
Listen ${EXPEDITION_HTTP_PORT}
Listen ${EXPEDITION_PORT}

<VirtualHost *:${EXPEDITION_HTTP_PORT}>
    DocumentRoot /var/www/pa-converter
    ServerName localhost
    <Directory /var/www/pa-converter>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    DirectoryIndex index.html index.php
    PassEnv RABBITMQ_HOST
    PassEnv DB_HOST
    PassEnv DB_USER
    PassEnv DB_PASS
    PassEnv JAVA_HOME
    PassEnv SPARK_HOME
    ErrorLog ${APACHE_LOG_DIR}/pa-converter-http-error.log
    CustomLog ${APACHE_LOG_DIR}/pa-converter-http-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:${EXPEDITION_PORT}>
    DocumentRoot /var/www/pa-converter
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    <Directory /var/www/pa-converter>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    DirectoryIndex index.html index.php
    PassEnv RABBITMQ_HOST
    PassEnv DB_HOST
    PassEnv DB_USER
    PassEnv DB_PASS
    PassEnv JAVA_HOME
    PassEnv SPARK_HOME
    ErrorLog ${APACHE_LOG_DIR}/pa-converter-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/pa-converter-ssl-access.log combined
</VirtualHost>
</IfModule>
