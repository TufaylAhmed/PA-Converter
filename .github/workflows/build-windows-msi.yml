name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "installer/windows/**"
      - "app/**"
      - "docker/**"
      - "databases/**"
      - "bin/**"
      - ".github/workflows/build-windows-msi.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "5.46.10"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix --version

      - name: Build MSI
        shell: pwsh
        run: |
          Set-Location installer/windows
          ./build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PA-Converter-windows
          path: |
            installer/windows/dist/*.msi
            installer/windows/dist/*-portable.zip

      - name: Attach installers to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/windows/dist/*.msi
            installer/windows/dist/*-portable.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: PA-Converter ${{ steps.ver.outputs.version }}
          body: |
            ## Windows install (self-contained)

            **You must be logged into GitHub** to download (private repo). Expected MSI size is ~50MB+.
            If the file is only a few KB, the download failed (HTML error page) — re-download while signed in.

            ### Recommended — Portable ZIP
            1. Download `PA-Converter-${{ steps.ver.outputs.version }}-portable.zip` (~50MB+) while logged into GitHub
            2. **Extract** the ZIP to a folder (do not run from inside the zip)
            3. Right-click `SETUP.bat` → **Run as administrator**
            4. If Windows asks to reboot for WSL, reboot once — setup continues
            5. Open https://localhost:18443 → `admin` / `paloalto`

            On failure, open `%ProgramData%\PA-Converter\logs\setup.log`

            ### MSI (optional)
            `PA-Converter-${{ steps.ver.outputs.version }}.msi` — Unblock in Properties if needed, then install.

            No Docker Desktop, Node.js, or GitHub token required on the PC.
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
