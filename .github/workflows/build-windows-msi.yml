name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "installer/windows/**"
      - "app/**"
      - "docker/**"
      - "databases/**"
      - "bin/**"
      - ".github/workflows/build-windows-msi.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "5.46.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix --version

      - name: Build MSI
        shell: pwsh
        run: |
          Set-Location installer/windows
          ./build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PA-Converter-msi
          path: installer/windows/dist/*.msi

      - name: Attach MSI to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/dist/*.msi
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: PA-Converter ${{ steps.ver.outputs.version }}
          body: |
            ## Self-contained Windows installer
            1. Run `PA-Converter-${{ steps.ver.outputs.version }}.msi`
            2. Allow UAC / finish setup (enables WSL; may reboot once)
            3. Open https://localhost:18443 → `admin` / `paloalto`

            No Docker Desktop, Node.js, or GitHub token required.
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
