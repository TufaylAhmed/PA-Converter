module(load="imtcp")
module(load="pmpanngfw")
module(load="mmnormalize")
module(load="ommysql")

$RepeatedMsgReduction off

$template PANOS_ConfigurationEntry,"INSERT INTO firewallUpdates \
                (deviceID,            user,         seqnu,                 command,       target,     before_value,   after_value,generated_time) \
        VALUES ('%$!serial_number%', '%$!user%',    '%$!sequence_number%', '%$!command%', '%$!path%', '%$!before_value%', '%$!after_value%', '%$!generated_time%')",SQL

$template PANOS_ConfigurationEntryDump,"INSERT INTO firewallUpdates \
                (deviceID,           user,          seqnu,                 command,       target,     before_value,   after_value,generated_time) \
        VALUES ('%$!serial_number%', '%$!user%',    '%$!sequence_number%', '%$!command%', '%$!path%', 'before_value', 'after_value', '%$!generated_time%')\n"

#----- Control State INSERTS

$template PANOS_Commit_Description,"INSERT INTO firewallUpdates \
                 (deviceID,          seqnu, command,      target, before_value, after_value,                               generated_time,       state_control) \
          VALUES ('%$!serial_number%', '0', '%$!opaque%', 'SYSTEM', '',        'Configuration has been commited', '%$!generated_time%', '11')",SQL

#$template PANOS_Commit_Enqueued,"INSERT INTO firewallUpdates \
#                 (deviceID,          seqnu, command,      target, before_value, after_value,                               generated_time,       state_control) \
#          VALUES ('%$!serial_number%', '0', '%$!opaque%', 'SYSTEM', '',        'Configuration has been commited', '%$!generated_time%', '11')",SQL

#$template PANOS_Commit_Started,"INSERT INTO firewallUpdates \
#                 (deviceID,          seqnu, command,      target, before_value, after_value,                               generated_time,       state_control) \
#          VALUES ('%$!serial_number%', '0', '%$!opaque%', 'SYSTEM', '',        'Configuration has been commited', '%$!generated_time%', '12')",SQL

$template PANOS_Commit_Succeeded,"INSERT INTO firewallUpdates \
                 (deviceID,          seqnu, command,      target, before_value, after_value,                               generated_time,       state_control) \
          VALUES ('%$!serial_number%', '0', '%$!opaque%', 'SYSTEM', '',        'Configuration has been commited', '%$!generated_time%', '1')",SQL

$template PANOS_LoadedRunning,"INSERT INTO firewallUpdates \
                 (deviceID,          seqnu, command,      target, before_value, after_value,                               generated_time,       state_control) \
          VALUES ('%$!serial_number%', '0', '%$!opaque%', 'SYSTEM', '',        'Reverted to Running Config', '%$!generated_time%', '2')",SQL

$template PANOS_LoadedSpecific,"INSERT INTO firewallUpdates \
                 (deviceID,          seqnu, command,      target, before_value, after_value,                               generated_time,       state_control) \
          VALUES ('%$!serial_number%', '0', '%$!opaque%', 'SYSTEM', '',        'Warning: Configuration has been loaded from untracked file.', '%$!generated_time%', '3')",SQL

#----- Default templates

$template DUMP,"%$!unparsed-data%\n"

$template alljson,"%$!all-json%\n"

#--------- End of templates

ruleset(name="pan-ngfw-config" parser=["rsyslog.panngfw", "rsyslog.rfc5424", "rsyslog.rfc3164"]){
        action(type="mmnormalize" rulebase="/etc/rsyslog.d/palo_alto_networks.rb" userawmsg="on")
        action(type="omfile" file="/var/log/rsyslog/dump" template="alljson")
        if strlen($!unparsed-data) == 0 then {
                if $!type == "CONFIG" and $!command != "commit" and $!result == "Succeeded" and ($!user != "mt_admin" and $!user != "mt_user" and $!user != "mt_viewer") then {
                        action(type="omfile" file="/var/log/rsyslog/sql" template="PANOS_ConfigurationEntry")
                        action(type="ommysql" server="localhost" serverport="3306" db="RealTimeUpdates" uid="root" pwd="paloalto" template="PANOS_ConfigurationEntry")
                }
                else if $!type == "SYSTEM" then {
                    # A commit is described
                    if $!severity == "informational" and $!module == "general" and $!opaque contains "Partial Commit for" then {
                        action(type="omfile" file="/var/log/rsyslog/sql" template="PANOS_Commit_Enqueued")
                        action(type="ommysql" server="localhost" serverport="3306" db="RealTimeUpdates" uid="root" pwd="paloalto" template="PANOS_Commit_Description")
                    }
                    #else if $!severity == "informational" and $!module == "general" and $!opaque contains "Commit job enqueued" then {
                    #    action(type="omfile" file="/var/log/rsyslog/sql" template="PANOS_Commit_Enqueued")
                    #    action(type="ommysql" server="localhost" serverport="3306" db="RealTimeUpdates" uid="root" pwd="paloalto" template="PANOS_Commit_Enqueued")
                    #}
                    ## A Commit starts
                    #else if $!severity == "informational" and $!module == "general" and $!opaque contains "Commit job started" then {
                    #    action(type="omfile" file="/var/log/rsyslog/sql" template="PANOS_Commit_Started")
                    #    action(type="ommysql" server="localhost" serverport="3306" db="RealTimeUpdates" uid="root" pwd="paloalto" template="PANOS_Commit_Started")
                    #}
                    # A Commit Completes
                    else if $!severity == "informational" and $!module == "general" and $!opaque contains "Commit job succeeded" then {
                        action(type="omfile" file="/var/log/rsyslog/sql" template="PANOS_Commit_Succeeded")
                        action(type="ommysql" server="localhost" serverport="3306" db="RealTimeUpdates" uid="root" pwd="paloalto" template="PANOS_Commit_Succeeded")
                    }
                    else if $!severity == "informational" and $!module == "general" and $!opaque  contains "Candidate configuration loaded from running-config.xml" then {
                        action(type="omfile" file="/var/log/rsyslog/sql" template="PANOS_LoadedRunning")
                        action(type="ommysql" server="localhost" serverport="3306" db="RealTimeUpdates" uid="root" pwd="paloalto" template="PANOS_LoadedRunning")
                    }
                    else if $!severity == "informational" and $!module == "general" and $!opaque  contains "Candidate configuration loaded"  then {
                        action(type="omfile" file="/var/log/rsyslog/sql" template="PANOS_LoadedSpecific")
                        action(type="ommysql" server="localhost" serverport="3306" db="RealTimeUpdates" uid="root" pwd="paloalto" template="PANOS_LoadedSpecific")
                    }
                }
                else if $!type == "TRAFFIC" then {
                        *.* /var/log/rsyslog/TRAFFIC
                }
                else if $!type == "THREAT" then {
                        *.* /var/log/rsyslog/THREAT
                }
                else {
                        *.* /var/log/rsyslog/raw
                        action(type="omfile" file="/var/log/rsyslog/unknown")
                }
        }
        else{
                action(type="omfile" file="/var/log/rsyslog/dump" template="alljson")
        }
        # *.* /var/log/rsyslog/raw
        *.* stop
}

input(type="imtcp" port="5141" ruleset="pan-ngfw-config")
# *.* /var/log/rsyslog/system

