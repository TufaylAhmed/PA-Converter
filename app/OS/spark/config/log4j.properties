log4j.rootLogger=WARN, file

log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=/tmp/PAN_Spark.log
log4j.appender.file.MaxFileSize=100MB
log4j.appender.file.MaxBackupIndex=1
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

log4j.logger.com.paloaltonetworks.tbd.Grouper$=INFO, CA, fileGrouper
log4j.additivity.com.paloaltonetworks.tbd.Grouper$=false
log4j.appender.fileGrouper=org.apache.log4j.RollingFileAppender
log4j.appender.fileGrouper.File=/tmp/PAN_RuleDisco.log
log4j.appender.fileGrouper.MaxFileSize=10MB
log4j.appender.fileGrouper.MaxBackupIndex=1
log4j.appender.fileGrouper.layout=org.apache.log4j.PatternLayout
log4j.appender.fileGrouper.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

log4j.logger.com.paloaltonetworks.tbd.RegionDiscovery$=INFO, CA, fileRegion
log4j.additivity.com.paloaltonetworks.tbd.RegionDiscovery$=false
log4j.appender.fileRegion=org.apache.log4j.RollingFileAppender
log4j.appender.fileRegion.File=/tmp/PAN_RegionDisco.log
log4j.appender.fileRegion.MaxFileSize=10MB
log4j.appender.fileRegion.MaxBackupIndex=1
log4j.appender.fileRegion.layout=org.apache.log4j.PatternLayout
log4j.appender.fileRegion.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n


log4j.logger.com.paloaltonetworks.tbd.LogCollectorCompacter$=INFO, CA, fileLogCoCo
log4j.additivity.com.paloaltonetworks.tbd.LogCollectorCompacter$=false
log4j.appender.fileLogCoCo=org.apache.log4j.RollingFileAppender
log4j.appender.fileLogCoCo.File=/tmp/PAN_LogCoCo.log
log4j.appender.fileLogCoCo.MaxFileSize=10MB
log4j.appender.fileLogCoCo.MaxBackupIndex=1
log4j.appender.fileLogCoCo.layout=org.apache.log4j.PatternLayout
log4j.appender.fileLogCoCo.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n


log4j.logger.com.paloaltonetworks.tbd.RuleAutoCompleter$=INFO, CA, fileRuleEn
log4j.additivity.com.paloaltonetworks.tbd.RuleAutoCompleter$=false
log4j.appender.fileRuleEn=org.apache.log4j.RollingFileAppender
log4j.appender.fileRuleEn.File=/tmp/PAN_RuleEnrichment.log
log4j.appender.fileRuleEn.MaxFileSize=10MB
log4j.appender.fileRuleEn.MaxBackupIndex=1
log4j.appender.fileRuleEn.layout=org.apache.log4j.PatternLayout
log4j.appender.fileRuleEn.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n


log4j.logger.com.paloaltonetworks.tbd.RuleDistanceCalculator$=INFO, CA, fileRuleDistance
log4j.additivity.com.paloaltonetworks.tbd.RuleDistanceCalculator$=false
log4j.appender.fileRuleDistance=org.apache.log4j.RollingFileAppender
log4j.appender.fileRuleDistance.File=/tmp/PAN_RuleDistnace.log
log4j.appender.fileRuleDistance.MaxFileSize=10MB
log4j.appender.fileRuleDistance.MaxBackupIndex=1
log4j.appender.fileRuleDistance.layout=org.apache.log4j.PatternLayout
log4j.appender.fileRuleDistance.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n


log4j.appender.CA=org.apache.log4j.ConsoleAppender
log4j.appender.CA.layout=org.apache.log4j.PatternLayout
log4j.appender.CA.layout.ConversionPattern=%-6r [%t] %-5p %c %x - %m%n

