#------------------------------------------
# PFconf file generated from <<<<configset>>>>
# on <<<<date>>>> by <<<<fwrules>>>>
#------------------------------------------

#------------------------------------------
# Defintion of network services
# Usage: service typ name port/members # comment
#------------------------------------------

<<<<<services>>>>>service <<<type>>> <<<name>>> <<<port>>><<<members>>> # <<<comment>>>


#------------------------------------------
# Defintion of network objects
#------------------------------------------
# Usage: 
#    object host name interface ip-addresse # comment
#    object network name interface base mask # comment
#    object group name members # comment
#------------------------------------------

<<<<<objects>>>>>object <<<type>>> <<<name>>> <<<location>>> <<<ipaddress>>> <<<netmask>>> <<<members>>> # <<<comment>>>


#------------------------------------------
# access rules
#------------------------------------------
# Usage: permision service von nach # comment
#------------------------------------------

<<<<<rules>>>>><<<action>>> <<<service>>> <<<from>>> <<<to>>> # <<<comment>>>


#------------------------------------------
# NAT rules
#------------------------------------------
# Usage: nat von nach svc tvon tnach tsvc
#------------------------------------------
<<<<<nat>>>>>nat <<<from>>> <<<to>>> <<<service>>> <<<tfrom>>> <<<tto>>> <<<tservice>>> # <<<comment>>>

