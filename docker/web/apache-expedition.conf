<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Prefer PHP files under API/userManager when present
DirectoryIndex index.html index.php

# Make Compose env visible to PHP (RabbitMQ host for job agent / ML tasks)
PassEnv RABBITMQ_HOST
PassEnv DB_HOST
PassEnv DB_USER
PassEnv DB_PASS
PassEnv JAVA_HOME
PassEnv SPARK_HOME
